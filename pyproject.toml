[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "whole-body-tracking"
version = "0.2.0"
description = "G1 whole-body motion tracking task package built on mjlab."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab[cu128]>=1.3,<1.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.scripts]
wbt-build-dataset = "whole_body_tracking.data.build_dataset:main"
wbt-play = "whole_body_tracking.tasks.general_tracking.scripts.play:main"
wbt-evaluate = "whole_body_tracking.tasks.general_tracking.scripts.evaluate:main"
wbt-export = "whole_body_tracking.tasks.general_tracking.scripts.export:main"

[project.entry-points."mjlab.tasks"]
whole_body_tracking = "whole_body_tracking._mjlab_tasks"

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
mujoco = { index = "mujoco" }
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "ea7f05b" }

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org"
explicit = true

[tool.uv]
override-dependencies = ["mujoco>=3.7.0.dev0"]

[dependency-groups]
dev = [
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "ruff>=0.14.14",
]

[tool.ruff]
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.10"
ignore = []
stubPath = "typings"
reportWildcardImportFromLibrary = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
